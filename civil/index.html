<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民法典法律助手</title>
<style>
  :root {
    --primary: #1e3a5f;
    --primary-dark: #14283f;
    --accent: #c9a24b;
    --bg: #eef1f5;
    --card: #ffffff;
    --text: #2b3440;
    --muted: #8a94a3;
    --border: #e3e8ef;
    --user-bubble: #1e3a5f;
    --ok: #1f9d63;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 820px;
    height: 100%;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(30, 58, 95, .12);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #fff;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .sub { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 3px; letter-spacing: 1px; }
  header .badge {
    margin-left: auto; font-size: 11px; color: var(--accent);
    border: 1px solid rgba(201,162,75,.5); padding: 3px 8px; border-radius: 20px;
  }

  #chat {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .msg { display: flex; gap: 10px; max-width: 88%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600;
  }
  .msg.assistant .avatar { background: #eef3fb; color: var(--primary); }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .bubble {
    padding: 12px 14px; border-radius: 14px; line-height: 1.7;
    font-size: 14px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .bubble {
    background: #f5f7fa; border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .msg.user .bubble {
    background: var(--user-bubble); color: #fff;
    border-top-right-radius: 4px;
  }

  /* 引用出处卡片 */
  .sources { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .source {
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 12px; background: #fff; font-size: 13px;
  }
  .source .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .source .title { font-weight: 600; color: var(--primary); }
  .source .scores { margin-left: auto; display: flex; gap: 6px; }
  .source .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 12px;
    background: #f0f2f5; color: var(--muted);
  }
  .source .chip.hot { background: #e8f6ef; color: var(--ok); font-weight: 600; }
  .source .src-file { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .source .content {
    margin-top: 6px; color: #4a5563; font-size: 13px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; cursor: pointer;
  }
  .source .content.expanded { display: block; -webkit-line-clamp: unset; }

  /* 打字动画 */
  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px; background: var(--muted); border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }

  footer {
    border-top: 1px solid var(--border); padding: 14px 16px; background: #fff;
  }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font-size: 14px; font-family: inherit; line-height: 1.5;
    outline: none; max-height: 120px;
  }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,58,95,.08); }
  button {
    background: var(--primary); color: #fff; border: none; border-radius: 12px;
    padding: 12px 20px; font-size: 14px; cursor: pointer; font-weight: 600;
    transition: .15s; flex-shrink: 0;
  }
  button:hover { background: var(--primary-dark); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .disclaimer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">法</div>
    <div>
      <h1>民法典法律助手</h1>
      <div class="sub">专业 · 精准 · 有据可查</div>
    </div>
    <div class="badge">RAG 检索增强</div>
  </header>

  <main id="chat"></main>

  <footer>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="请输入你的法律问题，例如：租房合同违约需要承担什么责任？"></textarea>
      <button id="send" onclick="send()">发送</button>
    </div>
    <div class="disclaimer">本回复仅供参考，不构成法律意见</div>
  </footer>
</div>

<script>
  // 后端地址（如果后端部署在其它机器，改这里）
  const API_BASE = 'https://api.3232132.xyz';

  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  // 欢迎语
  window.addEventListener('DOMContentLoaded', () => {
    appendAssistant('你好，我是民法典专业助手。\n请描述你的问题，我会检索相关法条并给出依据。', []);
  });

  // 回车发送，Shift+回车换行
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoGrow);

  function appendUser(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `
      <div class="avatar">我</div>
      <div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    chat.appendChild(div);
    scrollBottom();
  }

  function appendAssistant(text, sources) {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `
      <div class="avatar">法</div>
      <div style="flex:1;min-width:0">
        <div class="bubble"></div>
        <div class="sources"></div>
      </div>`;
    div.querySelector('.bubble').textContent = text;

    if (sources && sources.length) {
      const box = div.querySelector('.sources');
      box.innerHTML = '<div style="font-size:12px;color:var(--muted);margin:4px 0 2px">📚 引用出处</div>';
      sources.forEach(s => {
        const card = document.createElement('div');
        card.className = 'source';
        const hot = s.rerank_score >= 0.6;
        card.innerHTML = `
          <div class="title-row">
            <span class="title"></span>
            <span class="scores">
              <span class="chip">相关度 ${s.initial_score.toFixed(4)}</span>
              <span class="chip ${hot ? 'hot' : ''}">重排分 ${s.rerank_score.toFixed(4)}</span>
            </span>
          </div>
          <div class="src-file"></div>
          <div class="content"></div>`;
        card.querySelector('.title').textContent = s.full_title;
        card.querySelector('.src-file').textContent = '来源：' + s.source_file;
        const content = card.querySelector('.content');
        content.textContent = s.content;
        content.onclick = () => content.classList.toggle('expanded');
        box.appendChild(card);
      });
    }
    chat.appendChild(div);
    scrollBottom();
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.id = 'typing-msg';
    div.innerHTML = `
      <div class="avatar">法</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(div);
    scrollBottom();
  }
  function hideTyping() {
    const el = document.getElementById('typing-msg');
    if (el) el.remove();
  }

  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    appendUser(text);
    input.value = '';
    autoGrow();
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(`${API_BASE}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      hideTyping();
      appendAssistant(data.answer || '(无回答)', data.sources || []);
    } catch (e) {
      hideTyping();
      appendAssistant('请求失败，请确认后端已启动。\n错误信息：' + e.message, []);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
