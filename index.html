<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政府采购智能客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; display: flex; height: 100vh; background: #f0f4f8; }
  #sidebar { width: 260px; background: #1e3a5f; display: flex; flex-direction: column; color: #fff; }
  #sidebar h2 { padding: 18px 16px; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.12); letter-spacing: 1px; }
  #new-btn { margin: 14px 12px; padding: 11px; background: #2f6fdb; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: background .2s; }
  #new-btn:hover { background: #3b7de8; }
  #session-list { flex: 1; overflow-y: auto; padding: 0 10px; }
  .session-item { padding: 11px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 4px; color: #c9d6e8; }
  .session-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .session-item.active { background: #2f6fdb; color: #fff; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #chat-title { padding: 16px 20px; background: #fff; border-bottom: 1px solid #e3e8ef; font-weight: 600; color: #1e3a5f; font-size: 16px; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { max-width: 75%; margin-bottom: 14px; padding: 12px 16px; border-radius: 10px; line-height: 1.7; white-space: pre-wrap; font-size: 14px; }
  .msg.user { background: #2f6fdb; color: #fff; margin-left: auto; }
  .msg.assistant { background: #fff; border: 1px solid #e3e8ef; box-shadow: 0 1px 3px rgba(30,58,95,0.06); }
  .msg.system { background: #eef4fd; color: #1e3a5f; margin: 0 auto; font-size: 13px; max-width: 90%; }
  #input-bar { display: flex; padding: 14px 20px; background: #fff; border-top: 1px solid #e3e8ef; }
  #input { flex: 1; padding: 12px 14px; border: 1px solid #c8d3e0; border-radius: 8px; resize: none; font-size: 14px; outline: none; }
  #input:focus { border-color: #2f6fdb; }
  #send-btn { margin-left: 12px; padding: 12px 28px; background: #2f6fdb; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: background .2s; }
  #send-btn:hover { background: #3b7de8; }
  #send-btn:disabled { opacity: 0.5; }
  .quick-tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 14px; background: #fff; }
  .quick-tag { padding: 6px 14px; border: 1px solid #c8d3e0; border-radius: 16px; font-size: 12px; color: #2f6fdb; cursor: pointer; background: #fff; transition: all .2s; }
  .quick-tag:hover { background: #eef4fd; border-color: #2f6fdb; }
</style>
</head>
<body>
  <div id="sidebar">
    <h2>📋 会话列表</h2>
    <button id="new-btn">＋ 新会话</button>
    <div id="session-list"></div>
  </div>
  <div id="main">
    <div id="chat-title">政府采购智能客服</div>
    <div id="messages"></div>
    <div id="quick-tags" class="quick-tags"></div>
    <div id="input-bar">
      <textarea id="input" rows="1" placeholder="请输入您的问题，例如：教学楼建设67的中标金额是多少？（Enter 发送）"></textarea>
      <button id="send-btn">发送</button>
    </div>
  </div>
<script>
const API_BASE = "https://api.3232132.xyz/api";
const QUICK_QUESTIONS = [
  "教学楼建设67的中标金额是多少？",
  "供应商对单一来源采购公示有异议怎么办？",
  "最近有哪些医疗设备采购项目？"
];
let currentSid = null;
const $ = (id) => document.getElementById(id);
const USER = "default";
async function api(path, opts) {
  const r = await fetch(API_BASE + path, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || "请求失败");
  return data;
}
async function loadSessions() {
  const d = await api("/sessions?user_id=" + USER);
  $("session-list").innerHTML = "";
  d.sessions.forEach(s => {
    const div = document.createElement("div");
    div.className = "session-item" + (s.session_id === currentSid ? " active" : "");
    div.textContent = s.title || s.session_id;
    div.onclick = () => openSession(s.session_id, s.title);
    $("session-list").appendChild(div);
  });
}
async function openSession(sid, title) {
  currentSid = sid;
  $("chat-title").textContent = title || sid;
  document.querySelectorAll(".session-item").forEach(e => e.classList.remove("active"));
  loadSessions();
  const d = await api(`/sessions/${sid}/messages`);
  $("messages").innerHTML = "";
  d.messages.forEach(m => addMsg(m.role, m.content));
}
function addMsg(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = content;
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
}
async function send() {
  const text = $("input").value.trim();
  if (!text || !currentSid) return;
  $("input").value = "";
  addMsg("user", text);
  $("send-btn").disabled = true;
  try {
    const d = await api(`/sessions/${currentSid}/messages`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({content: text})
    });
    addMsg("assistant", d.content);
  } catch (e) {
    addMsg("system", "⚠️ " + e.message);
  }
  $("send-btn").disabled = false;
}
$("new-btn").onclick = async () => {
  const d = await api("/sessions", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({user_id: USER, title: "新会话 " + new Date().toLocaleTimeString()})});
  openSession(d.session_id, d.title);
};
$("send-btn").onclick = send;
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
// 快捷提问标签
QUICK_QUESTIONS.forEach(q => {
  const t = document.createElement("button");
  t.className = "quick-tag";
  t.textContent = q;
  t.onclick = () => { $("input").value = q; send(); };
  $("quick-tags").appendChild(t);
});
loadSessions().then(() => {
  if (!currentSid)
    $("messages").innerHTML = '<div class="msg system">👋 欢迎使用<strong>政府采购智能客服</strong>！我可以为您解答：<br>📌 <strong>采购咨询</strong>：项目信息、中标结果、金额周期<br>📌 <strong>法务咨询</strong>：异议、投诉、单一来源等法律实务<br>📌 <strong>心理陪伴</strong>：情绪疏导与压力缓解<br><br>点击上方「＋ 新会话」或快捷提问开始吧！</div>';
});
</script>
</body>
</html>
