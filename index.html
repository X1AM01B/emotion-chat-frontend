<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服系统</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3b54d6;
    --bg: #eef2f9;
    --sidebar-bg: #16213a;
    --card: #ffffff;
    --text: #1e2a44;
    --text-light: #7a8aa5;
    --border: #e4e9f2;
    --success: #22c55e;
    --danger: #ef4444;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }

  /* ===== 登录/注册页 ===== */
  #auth-page {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #16213a 0%, #1f2f57 45%, #4f6ef7 100%);
  }
  #auth-page::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,.06) 0%, transparent 40%);
  }
  .auth-card {
    position: relative; width: 400px; padding: 42px 38px;
    background: rgba(255,255,255,.97); border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    animation: fadeUp .5s ease;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  .auth-logo {
    width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #fff; box-shadow: 0 8px 20px rgba(79,110,247,.4);
  }
  .auth-card h1 { text-align: center; font-size: 22px; margin-bottom: 4px; }
  .auth-card .sub { text-align: center; color: var(--text-light); font-size: 13px; margin-bottom: 26px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 14px; outline: none; transition: border .2s;
  }
  .field input:focus { border-color: var(--primary); }
  .btn-primary {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .2s;
  }
  .btn-primary:hover { opacity: .9; }
  .auth-switch { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-light); }
  .auth-switch a { color: var(--primary); cursor: pointer; text-decoration: none; font-weight: 600; }
  .auth-err { background: #fef2f2; color: var(--danger); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; display: none; }

  /* ===== 主界面 ===== */
  #app { display: flex; height: 100vh; }
  #sidebar { width: 280px; background: var(--sidebar-bg); display: flex; flex-direction: column; color: #fff; }
  .side-head { padding: 18px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .side-head .avatar {
    width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), #8b5cf6);
    display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;
  }
  .side-head .who { flex: 1; }
  .side-head .who .name { font-size: 14px; font-weight: 600; }
  .side-head .who .role { font-size: 11px; color: #8fa3c8; }
  .side-head .logout { background: none; border: 1px solid rgba(255,255,255,.25); color: #cbd6ea; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .side-head .logout:hover { background: rgba(255,255,255,.1); }
  #new-btn {
    margin: 14px 14px 8px; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-size: 14px; font-weight: 600;
  }
  #new-btn:hover { opacity: .9; }
  .side-label { padding: 8px 18px 4px; font-size: 11px; color: #8fa3c8; letter-spacing: 1px; }
  #session-list { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
  .session-item {
    display: flex; align-items: center; gap: 8px; padding: 11px 12px; border-radius: 10px;
    cursor: pointer; font-size: 13px; margin-bottom: 4px; color: #cbd6ea; transition: background .15s;
  }
  .session-item:hover { background: rgba(255,255,255,.08); }
  .session-item.active { background: var(--primary); color: #fff; }
  .session-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-del { border: none; background: none; color: inherit; font-size: 15px; cursor: pointer; opacity: .4; width: 22px; height: 22px; border-radius: 50%; }
  .session-del:hover { opacity: 1; background: rgba(255,255,255,.2); }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-title {
    padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--border);
    font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px;
  }
  #chat-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
  #messages { flex: 1; overflow-y: auto; padding: 28px 32px; }
  .msg { display: flex; margin-bottom: 18px; }
  .msg.user { justify-content: flex-end; }
  .msg .bubble {
    max-width: 68%; padding: 12px 16px; border-radius: 16px; line-height: 1.7; font-size: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: var(--card); border: 1px solid var(--border);
    border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(30,42,68,.05);
  }
  .msg.system { justify-content: center; }
  .msg.system .bubble { background: #eef3ff; color: var(--text); font-size: 13px; max-width: 92%; text-align: center; }

  #quick-tags { display: flex; gap: 8px; padding: 0 24px 12px; flex-wrap: wrap; }
  .quick-tag {
    padding: 7px 14px; border: 1px solid var(--primary); border-radius: 20px;
    background: #fff; color: var(--primary); font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .quick-tag:hover { background: var(--primary); color: #fff; }
  #input-bar { display: flex; padding: 14px 24px 20px; gap: 12px; }
  #input {
    flex: 1; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: 12px;
    resize: none; font-size: 14px; outline: none; transition: border .2s; background: var(--card);
  }
  #input:focus { border-color: var(--primary); }
  #send-btn {
    padding: 0 28px; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-size: 14px; font-weight: 600;
  }
  #send-btn:hover { opacity: .9; }
  #send-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ===== 管理员面板 ===== */
  #admin-panel {
    position: fixed; inset: 0; z-index: 90; background: rgba(15,23,42,.6);
    display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px);
  }
  #admin-panel.show { display: flex; }
  .admin-card {
    width: 760px; max-height: 82vh; overflow-y: auto; background: var(--card);
    border-radius: 18px; padding: 28px; box-shadow: 0 24px 60px rgba(0,0,0,.3);
  }
  .admin-card h2 { font-size: 18px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .admin-card .close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-light); }
  .admin-add { display: flex; gap: 10px; margin-bottom: 18px; }
  .admin-add input { flex: 1; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; }
  .admin-add input:focus { border-color: var(--primary); }
  .admin-add .btn-primary { width: auto; padding: 10px 20px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-light); font-weight: 600; font-size: 12px; background: #f8fafc; }
  .role-badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .role-badge.admin { background: #fef3c7; color: #92400e; }
  .role-badge.user { background: #e0e7ff; color: #3730a3; }
  .btn-danger { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 4px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .admin-btn {
    margin: 8px 14px 0; padding: 10px; border: none; border-radius: 10px; cursor: pointer;
    background: rgba(255,255,255,.1); color: #cbd6ea; font-size: 13px;
  }
  .admin-btn:hover { background: rgba(255,255,255,.2); }
  .empty { text-align: center; color: var(--text-light); padding: 30px; font-size: 13px; }
</style>
</head>
<body>

<!-- ===== 登录/注册 ===== -->
<div id="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🎧</div>
    <h1 id="auth-title">欢迎登录</h1>
    <div class="sub">政府采购智能客服系统</div>
    <div class="auth-err" id="auth-err"></div>
    <div class="field"><label>用户名</label><input id="auth-username" placeholder="请输入用户名" autocomplete="username"></div>
    <div class="field"><label>密码</label><input id="auth-password" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
    <button class="btn-primary" id="auth-submit">登 录</button>
    <div class="auth-switch"><span id="auth-switch-text">还没有账号？<a id="auth-switch-link">立即注册</a></span></div>
  </div>
</div>

<!-- ===== 主界面 ===== -->
<div id="app" style="display:none">
  <div id="sidebar">
    <div class="side-head">
      <div class="avatar" id="my-avatar">客</div>
      <div class="who">
        <div class="name" id="my-name">用户</div>
        <div class="role" id="my-role">普通用户</div>
      </div>
      <button class="logout" id="logout-btn">退出</button>
    </div>
    <button id="new-btn">＋ 新会话</button>
    <div class="side-label">最近会话</div>
    <div id="session-list"></div>
    <button class="admin-btn" id="admin-btn" style="display:none">🛠 用户管理</button>
  </div>
  <div id="main">
    <div id="chat-title"><span class="dot"></span><span id="chat-title-text">政府采购智能客服</span></div>
    <div id="messages"></div>
    <div id="quick-tags"></div>
    <div id="input-bar">
      <textarea id="input" rows="1" placeholder="请输入您的问题，例如：教学楼建设67的中标金额是多少？（Enter 发送）"></textarea>
      <button id="send-btn">发送</button>
    </div>
  </div>
</div>

<!-- ===== 管理员面板 ===== -->
<div id="admin-panel">
  <div class="admin-card">
    <h2>👥 用户管理 <button class="close" id="admin-close">×</button></h2>
    <div class="admin-add">
      <input id="add-username" placeholder="新用户用户名">
      <input id="add-password" type="password" placeholder="初始密码">
      <button class="btn-primary" id="add-user-btn">添加用户</button>
    </div>
    <table>
      <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>会话数</th><th>注册时间</th><th>操作</th></tr></thead>
      <tbody id="user-table"></tbody>
    </table>
    <div class="empty" id="user-empty" style="display:none">暂无用户</div>
  </div>
</div>

<script>
const API_BASE = "https://api.3232132.xyz/api";
const QUICK_QUESTIONS = [
  "教学楼建设67的中标金额是多少？",
  "供应商对单一来源采购公示有异议怎么办？",
  "最近压力很大总是失眠，该怎么办？"
];
const $ = id => document.getElementById(id);
let token = localStorage.getItem("token") || "";
let username = localStorage.getItem("username") || "";
let role = localStorage.getItem("role") || "";
let currentSid = null;

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  const r = await fetch(API_BASE + path, { ...opts, headers });
  let data;
  try { data = await r.json(); } catch { data = {}; }
  if (!r.ok) throw new Error(data.detail || "请求失败");
  return data;
}

/* ===== 认证 ===== */
let isLoginMode = true;
function showAuth() {
  $("auth-page").style.display = "flex";
  $("app").style.display = "none";
}
function showApp() {
  $("auth-page").style.display = "none";
  $("app").style.display = "flex";
  $("my-name").textContent = username;
  $("my-role").textContent = role === "admin" ? "管理员" : "普通用户";
  $("my-avatar").textContent = username[0] ? username[0].toUpperCase() : "客";
  $("admin-btn").style.display = role === "admin" ? "block" : "none";
  $("messages").innerHTML = '<div class="msg system"><div class="bubble">👋 欢迎使用<strong>政府采购智能客服</strong>！<br>📌 采购咨询 · 法务咨询 · 心理陪伴<br>点击「＋ 新会话」或下方快捷提问开始吧！</div></div>';
  loadSessions();
}
async function doAuth() {
  const u = $("auth-username").value.trim();
  const p = $("auth-password").value;
  const err = $("auth-err");
  err.style.display = "none";
  if (!u || !p) { err.textContent = "请输入用户名和密码"; err.style.display = "block"; return; }
  try {
    const path = isLoginMode ? "/login" : "/register";
    const d = await api(path, { method: "POST", body: JSON.stringify({ username: u, password: p }) });
    token = d.token; username = d.username; role = d.role;
    localStorage.setItem("token", token);
    localStorage.setItem("username", username);
    localStorage.setItem("role", role);
    showApp();
  } catch (e) { err.textContent = e.message; err.style.display = "block"; }
}
$("auth-submit").onclick = doAuth;
$("auth-password").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });
function toggleAuthMode() {
  isLoginMode = !isLoginMode;
  $("auth-title").textContent = isLoginMode ? "欢迎登录" : "创建账号";
  $("auth-submit").textContent = isLoginMode ? "登 录" : "注 册";
  $("auth-switch-text").innerHTML = isLoginMode ? '还没有账号？<a id="auth-switch-link">立即注册</a>' : '已有账号？<a id="auth-switch-link">去登录</a>';
  document.getElementById("auth-switch-link").onclick = toggleAuthMode;
}
document.getElementById("auth-switch-link").onclick = toggleAuthMode;
$("logout-btn").onclick = () => {
  localStorage.clear(); token = ""; username = ""; role = ""; currentSid = null;
  showAuth();
};

/* ===== 会话 ===== */
async function loadSessions() {
  const d = await api("/sessions");
  $("session-list").innerHTML = "";
  if (!d.sessions.length) { $("session-list").innerHTML = '<div class="empty">暂无会话</div>'; return; }
  d.sessions.forEach(s => {
    const div = document.createElement("div");
    div.className = "session-item" + (s.session_id === currentSid ? " active" : "");
    div.onclick = () => openSession(s.session_id, s.title);
    const title = document.createElement("span");
    title.className = "session-title";
    title.textContent = s.title || s.session_id;
    title.onclick = e => { e.stopPropagation(); openSession(s.session_id, s.title); };
    const del = document.createElement("button");
    del.className = "session-del"; del.textContent = "×"; del.title = "删除会话";
    del.onclick = async e => {
      e.stopPropagation();
      if (!confirm("确定删除该会话？")) return;
      try {
        await api(`/sessions/${s.session_id}`, { method: "DELETE" });
        if (currentSid === s.session_id) { currentSid = null; $("chat-title-text").textContent = "政府采购智能客服"; $("messages").innerHTML = ""; }
        loadSessions();
      } catch (err) { alert("删除失败：" + err.message); }
    };
    div.appendChild(title); div.appendChild(del);
    $("session-list").appendChild(div);
  });
}
async function openSession(sid, title) {
  currentSid = sid;
  $("chat-title-text").textContent = title || sid;
  document.querySelectorAll(".session-item").forEach(e => e.classList.remove("active"));
  loadSessions();
  const d = await api(`/sessions/${sid}/messages`);
  $("messages").innerHTML = "";
  d.messages.forEach(m => addMsg(m.role, m.content));
}
function addMsg(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = content;
  div.appendChild(b);
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
}
async function send() {
  const text = $("input").value.trim();
  if (!text || !currentSid) return;
  $("input").value = "";
  addMsg("user", text);
  $("send-btn").disabled = true;
  try {
    const d = await api(`/sessions/${currentSid}/messages`, { method: "POST", body: JSON.stringify({ content: text }) });
    addMsg("assistant", d.content);
  } catch (e) {
    addMsg("system", "⚠️ " + e.message);
  }
  $("send-btn").disabled = false;
}
$("new-btn").onclick = async () => {
  const d = await api("/sessions", { method: "POST", body: JSON.stringify({ title: "新会话 " + new Date().toLocaleTimeString() }) });
  openSession(d.session_id, d.title);
};
$("send-btn").onclick = send;
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
QUICK_QUESTIONS.forEach(q => {
  const t = document.createElement("button");
  t.className = "quick-tag"; t.textContent = q;
  t.onclick = () => { $("input").value = q; send(); };
  $("quick-tags").appendChild(t);
});

/* ===== 管理员 ===== */
async function loadUsers() {
  const d = await api("/admin/users");
  const tb = $("user-table");
  tb.innerHTML = "";
  $("user-empty").style.display = d.users.length ? "none" : "block";
  d.users.forEach(u => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${u.id}</td><td>${u.username}</td>
      <td><span class="role-badge ${u.role}">${u.role === "admin" ? "管理员" : "用户"}</span></td>
      <td>${u.session_count}</td><td>${u.created_at}</td>
      <td>${u.username === username ? "当前账号" : `<button class="btn-danger" data-del="${u.id}" data-name="${u.username}">删除</button>`}</td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = async () => {
      const name = btn.dataset.name;
      if (!confirm(`确定删除用户「${name}」？其全部会话将被清除。`)) return;
      try {
        await api(`/admin/users/${btn.dataset.del}`, { method: "DELETE" });
        loadUsers();
      } catch (e) { alert(e.message); }
    };
  });
}
$("admin-btn").onclick = () => { $("admin-panel").classList.add("show"); loadUsers(); };
$("admin-close").onclick = () => $("admin-panel").classList.remove("show");
$("add-user-btn").onclick = async () => {
  const u = $("add-username").value.trim();
  const p = $("add-password").value;
  if (!u || !p) { alert("请填写用户名和密码"); return; }
  try {
    await api("/admin/users", { method: "POST", body: JSON.stringify({ username: u, password: p }) });
    $("add-username").value = ""; $("add-password").value = "";
    loadUsers();
  } catch (e) { alert(e.message); }
};

/* ===== 初始化 ===== */
(async () => {
  if (token) {
    try { const me = await api("/me"); username = me.username; role = me.role; localStorage.setItem("role", role); showApp(); }
    catch { showAuth(); }
  } else { showAuth(); }
})();
</script>
</body>
</html>
